<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#ffffff;font-family:'DejaVu Sans','Liberation Sans',sans-serif}
  .grid{width:1080px;height:1080px;box-sizing:border-box;padding:40px 40px 20px;
        display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px}
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .circle{width:250px;height:250px;border-radius:50%;background-size:cover;background-position:center;
          box-shadow:0 4px 14px rgba(0,0,0,0.18);border:3px solid #eee}
  .label{margin-top:14px;font-size:26px;font-weight:800;color:#2A1A12}
  .sub{font-size:18px;color:#8a8a8a;margin-top:2px}
  h1{position:absolute}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="circle" style="background-image:url('../logos/logo1-monogram.png')"></div><div class="label">① モノグラム</div><div class="sub">MD badge</div></div>
  <div class="cell"><div class="circle" style="background-image:url('../logos/logo2-marigold.png')"></div><div class="label">② マリーゴールド</div><div class="sub">花モチーフ</div></div>
  <div class="cell"><div class="circle" style="background-image:url('../logos/logo3-bowl.png')"></div><div class="label">③ スパイス皿</div><div class="sub">masala bowl</div></div>
  <div class="cell"><div class="circle" style="background-image:url('../logos/logo4-stack.png')"></div><div class="label">④ タイポ</div><div class="sub">文字ロゴ</div></div>
  <div class="cell"><div class="circle" style="background-image:url('../logos/logo5-rangoli.png')"></div><div class="label">⑤ ランゴリ</div><div class="sub">装飾パターン</div></div>
  <div class="cell"><div class="circle" style="background-image:url('../logos/logo6-stamp.png')"></div><div class="label">⑥ スタンプ</div><div class="sub">旅の消印風</div></div>
</div>
</body></html>
