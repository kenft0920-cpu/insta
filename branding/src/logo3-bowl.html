<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  text{font-family:'DejaVu Sans','Liberation Sans',sans-serif}
</style></head><body>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1080" fill="#FBF1DD"/>
  <!-- three spice mounds in a bowl -->
  <g>
    <!-- mounds -->
    <path d="M300 470 q90 -150 180 0 z" fill="#F2A81D"/>
    <path d="M470 470 q70 -190 140 0 z" fill="#D23B2E"/>
    <path d="M600 470 q90 -150 180 0 z" fill="#4C7A34"/>
    <!-- a few spice specks -->
    <circle cx="360" cy="430" r="6" fill="#B5820F"/>
    <circle cx="420" cy="450" r="5" fill="#B5820F"/>
    <circle cx="540" cy="400" r="6" fill="#7A1F1A"/>
    <circle cx="690" cy="440" r="6" fill="#2F5220"/>
    <!-- bowl -->
    <path d="M250 470 h580 a290 290 0 0 1 -580 0 z" fill="#7A1F1A"/>
    <path d="M250 470 h580 a290 290 0 0 1 -580 0 z" fill="none" stroke="#5A1512" stroke-width="4"/>
    <!-- bowl rim -->
    <rect x="235" y="452" width="610" height="34" rx="17" fill="#8E2A22"/>
  </g>
  <!-- wordmark -->
  <text x="540" y="820" text-anchor="middle" font-size="118" font-weight="800" fill="#7A1F1A" letter-spacing="1">Masala</text>
  <text x="540" y="905" text-anchor="middle" font-size="58" font-weight="700" fill="#E8622C" letter-spacing="22">DAYS</text>
</svg>
</body></html>
