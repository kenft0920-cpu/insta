<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#fff;font-family:'DejaVu Sans','Liberation Sans',sans-serif}
  .grid{width:1080px;height:1080px;box-sizing:border-box;padding:60px 40px;
        display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:20px}
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .circle{width:340px;height:340px;border-radius:50%;background-size:cover;background-position:center;
          box-shadow:0 6px 18px rgba(0,0,0,0.18);border:3px solid #eee}
  .label{margin-top:18px;font-size:30px;font-weight:800;color:#2A1A12}
  .sub{font-size:20px;color:#8a8a8a;margin-top:2px}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="circle" style="background-image:url('../logos/v3a-cream.png')"></div><div class="label">3A クリーム</div><div class="sub">清潔・王道</div></div>
  <div class="cell"><div class="circle" style="background-image:url('../logos/v3b-teal.png')"></div><div class="label">3B 深緑</div><div class="sub">上品・映える</div></div>
  <div class="cell"><div class="circle" style="background-image:url('../logos/v3c-saffron.png')"></div><div class="label">3C サフラン</div><div class="sub">元気・暖色</div></div>
  <div class="cell"><div class="circle" style="background-image:url('../logos/v3d-badge.png')"></div><div class="label">3D バッジ</div><div class="sub">ロゴ感・囲み文字</div></div>
</div>
</body></html>
